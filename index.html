<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador AR Universitario</title>
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Tailwind CSS para la UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #1a202c; }
        .ar-ui { position: fixed; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        #instructions { background: rgba(0, 0, 0, 0.85); border-radius: 1rem; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(4px); }
        #simular-btn { display: none; }
        @media (min-width: 1024px) { #simular-btn { display: block; } }
    </style>
</head>
<body>

    <!-- Interfaz de Usuario (UI) -->
    <div id="overlay" class="ar-ui inset-0 flex flex-col items-center justify-between p-6 text-white text-center">
        <!-- Encabezado -->
        <div class="mt-4 w-full flex justify-between items-start px-4">
            <div class="text-left">
                <h1 class="text-xl md:text-2xl font-bold uppercase tracking-widest text-blue-400">Navegador AR</h1>
                <p id="destino-ui" class="text-sm font-medium text-gray-300">Destino: Cargando...</p>
            </div>
            <div class="bg-black/50 px-3 py-1 rounded-full text-xs border border-white/20">
                <span id="status" class="text-yellow-400">Escaneando entorno...</span>
            </div>
        </div>

        <!-- Instrucciones Centrales -->
        <div id="instructions" class="p-6 w-full max-w-md mb-12 shadow-2xl">
            <div class="flex justify-center mb-4">
                <svg id="scan-icon" class="w-12 h-12 text-blue-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
            </div>
            <p id="instruction-text" class="mb-6 text-lg font-medium text-gray-200">Apunta la cámara al piso frente al cartel.</p>
            
            <button id="place-route-btn" class="interactive hidden w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition-all transform hover:scale-105">
                INICIAR NAVEGACIÓN
            </button>
            
            <!-- Botón de simulación -->
            <button id="simular-btn" class="interactive w-full mt-4 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-8 rounded-xl text-sm">
                (PC) Simular AR
            </button>
        </div>
        
        <!-- Aviso para iOS -->
        <div id="ios-warning" class="hidden interactive bg-red-900/90 border border-red-500 p-4 rounded-xl mb-4 text-sm max-w-md shadow-lg">
            <p class="font-bold text-red-200 mb-1">Aviso para iOS</p>
            <p class="text-red-100">Safari no soporta AR por defecto. Por favor descarga la app <b>WebXR Viewer</b> de Mozilla para usar este mapa.</p>
        </div>
    </div>

    <!-- Escena A-Frame -->
    <a-scene 
        webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay; overlayElement: #overlay;"
        xr-mode-ui="XRMode: ar"
        renderer="colorManagement: true; antialias: true;">
        
        <a-assets>
            <img id="glow" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" crossorigin="anonymous">
        </a-assets>

        <!-- Cámara -->
        <a-entity camera position="0 1.6 0"></a-entity>

        <!-- Retícula de selección -->
        <a-entity id="reticle" visible="false">
            <a-ring color="#3b82f6" radius-inner="0.1" radius-outer="0.15" rotation="-90 0 0" material="shader: flat; opacity: 0.8;">
                <a-circle color="#60a5fa" radius="0.05" animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; dur: 800; loop: true"></a-circle>
            </a-ring>
        </a-entity>

        <!-- Contenedor de la Ruta -->
        <a-entity id="route-container"></a-entity>

        <!-- Entorno simulado -->
        <a-entity id="entorno-simulado" visible="false">
            <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#2d3748"></a-plane>
            <a-grid position="0 0.01 0"></a-grid>
        </a-entity>

    </a-scene>

    <script>
        // =====================================================================
        // --- CONFIGURACIÓN DE RUTAS (Actualizado con distancias satelitales) ---
        // =====================================================================
        const RUTAS = {
            'ruta_principal': [
                // 1. Recta inicial desde el Punto 0 (Caminando de frente hacia el Este / 99°)
                { x: 0, y: 0, z: 0 },
                { x: 0, y: 0, z: -115 },    // Avance de 115m hasta justo antes de la rotonda
                
                // 2. Curva suave a la izquierda (Rodeando la rotonda para enfilar al Norte)
                { x: -8, y: 0, z: -130 },   // Inicio del giro
                { x: -20, y: 0, z: -140 },  // Fin de la curva, ya mirando hacia el Norte
                
                // 3. Recta hacia el Norte (Caminando paralelo a las áreas verdes y edificios)
                { x: -105, y: 0, z: -140 }, // Avance largo de 85m por el pasillo central
                
                // 4. Curva superior a la derecha (Hacia Dirección de Hoteles)
                { x: -115, y: 0, z: -148 }, // Inicio del giro a la derecha
                { x: -120, y: 0, z: -160 }, // Fin de la curva, mirando nuevamente hacia el Este
                
                // 5. Recta final hacia el Este (Hasta el destino exacto)
                { x: -120, y: 0, z: -200 }  // Llegada a la marca de los 302.30 metros
            ]
        };
        // =====================================================================

        // --- RASTREO DE BRÚJULA (ORIENTACIÓN ABSOLUTA) ---
        let brujulaActual = 0;
        const RUTA_HEADING = 99; // Rumbo magnético de la primera recta

        // Sensor para Android
        window.addEventListener('deviceorientationabsolute', (event) => {
            if (event.alpha !== null) {
                // Convertimos el eje alpha de Android a grados de brújula estándar
                brujulaActual = (450 - event.alpha) % 360;
            }
        }, true);

        // Sensor de respaldo para iOS
        window.addEventListener('deviceorientation', (event) => {
            if (event.webkitCompassHeading) {
                brujulaActual = event.webkitCompassHeading;
            }
        }, true);

        const scene = document.querySelector('a-scene');
        const reticle = document.getElementById('reticle');
        const routeContainer = document.getElementById('route-container');
        const statusText = document.getElementById('status');
        const instructionText = document.getElementById('instruction-text');
        const placeBtn = document.getElementById('place-route-btn');
        const scanIcon = document.getElementById('scan-icon');
        const simularBtn = document.getElementById('simular-btn');
        const entornoSimulado = document.getElementById('entorno-simulado');
        const destinoUI = document.getElementById('destino-ui');
        
        let hitTestSource = null;
        let localSpace = null;
        let routePlaced = false;

        if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
            document.getElementById('ios-warning').classList.remove('hidden');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const destino = urlParams.get('destino') || 'ruta_principal'; 
        
        destinoUI.innerText = `Destino: ${destino.replace(/_/g, ' ').toUpperCase()}`;

        scene.addEventListener('enter-vr', async () => {
            if (scene.is('ar-mode')) {
                simularBtn.style.display = 'none';
                statusText.innerText = "Buscando piso...";
                statusText.className = "text-yellow-400";
                
                const session = scene.xrSession;
                const viewerSpace = await session.requestReferenceSpace('viewer');
                hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
                localSpace = await session.requestReferenceSpace('local-floor');

                session.requestAnimationFrame(onXRFrame);
            }
        });

        function onXRFrame(time, frame) {
            const session = frame.session;
            if (!hitTestSource || routePlaced) return;

            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
                const hit = hitTestResults[0];
                const pose = hit.getPose(localSpace);

                reticle.setAttribute('visible', 'true');
                reticle.setAttribute('position', pose.transform.position);
                
                statusText.innerText = "¡Piso detectado!";
                statusText.className = "text-green-400 font-bold";
                instructionText.innerText = "Toca INICIAR NAVEGACIÓN. La ruta se alineará automáticamente.";
                scanIcon.style.display = 'none';
                placeBtn.classList.remove('hidden');
            } else {
                reticle.setAttribute('visible', 'false');
                placeBtn.classList.add('hidden');
                statusText.innerText = "Buscando piso...";
                statusText.className = "text-yellow-400";
                scanIcon.style.display = 'block';
            }
            session.requestAnimationFrame(onXRFrame);
        }

        // --- DIBUJAR LA RUTA EN 3D REAL ---
        function generarRuta(target, isSimulation = false) {
            const puntos = RUTAS[target] || [{x:0, y:0, z:0}, {x:0, y:0, z:-5}]; 
            const colorRuta = '#3b82f6'; 

            puntos.forEach((p, index) => {
                const currentY = p.y || 0; 

                // 1. Nodos (Esferas)
                const node = document.createElement('a-entity');
                node.setAttribute('position', `${p.x} ${currentY + 0.05} ${p.z}`); 
                
                const ring = document.createElement('a-ring');
                ring.setAttribute('radius-inner', '0.1');
                ring.setAttribute('radius-outer', '0.15');
                ring.setAttribute('rotation', '-90 0 0');
                ring.setAttribute('color', colorRuta);
                ring.setAttribute('material', 'shader: flat;');
                
                const sphere = document.createElement('a-sphere');
                sphere.setAttribute('radius', '0.08');
                sphere.setAttribute('color', '#60a5fa');
                sphere.setAttribute('material', `shader: flat; color: #60a5fa;`); 
                
                node.appendChild(ring);
                node.appendChild(sphere);
                routeContainer.appendChild(node);

                // 2. Líneas 3D 
                if (index < puntos.length - 1) {
                    const next = puntos[index + 1];
                    const nextY = next.y || 0;
                    
                    const dx = next.x - p.x;
                    const dy = nextY - currentY;
                    const dz = next.z - p.z;

                    const distance2D = Math.sqrt(dx*dx + dz*dz);
                    const distance3D = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    const midX = (p.x + next.x) / 2;
                    const midY = (currentY + nextY) / 2;
                    const midZ = (p.z + next.z) / 2;

                    const yaw = Math.atan2(dx, dz) * (180 / Math.PI);
                    const pitch = Math.atan2(dy, distance2D) * (180 / Math.PI);

                    const pathLine = document.createElement('a-cylinder');
                    pathLine.setAttribute('position', `${midX} ${midY + 0.02} ${midZ}`);
                    pathLine.setAttribute('rotation', `${90 - pitch} ${yaw} 0`); 
                    pathLine.setAttribute('radius', '0.05'); 
                    pathLine.setAttribute('height', distance3D);
                    pathLine.setAttribute('color', colorRuta);
                    pathLine.setAttribute('material', `shader: flat; opacity: 0.6; transparent: true;`);
                    routeContainer.appendChild(pathLine);
                    
                    // Flechas
                    const numArrows = Math.max(1, Math.floor(distance3D / 2));
                    for(let i = 1; i <= numArrows; i++) {
                        const ratio = i / (numArrows + 1);
                        const arrowX = p.x + dx * ratio;
                        const arrowY = currentY + dy * ratio;
                        const arrowZ = p.z + dz * ratio;
                        
                        const arrow = document.createElement('a-entity');
                        arrow.setAttribute('position', `${arrowX} ${arrowY + 0.1} ${arrowZ}`);
                        arrow.setAttribute('rotation', `${pitch} ${yaw + 180} 0`); 
                        
                        const triangle = document.createElement('a-triangle');
                        triangle.setAttribute('scale', '0.2 0.3 0.2');
                        triangle.setAttribute('color', '#ffffff');
                        triangle.setAttribute('material', 'shader: flat;');
                        triangle.setAttribute('animation', `property: position; dir: alternate; dur: 1000; easing: easeInOutSine; loop: true; to: 0 0.1 0; from: 0 0 0`);
                        
                        arrow.appendChild(triangle);
                        routeContainer.appendChild(arrow);
                    }
                }

                // 3. Destino Final
                if (index === puntos.length - 1) {
                    const goal = document.createElement('a-entity');
                    goal.setAttribute('position', `${p.x} ${currentY} ${p.z}`);

                    const cylinder = document.createElement('a-cylinder');
                    cylinder.setAttribute('radius', '0.5');
                    cylinder.setAttribute('height', '2');
                    cylinder.setAttribute('position', '0 1 0');
                    cylinder.setAttribute('color', '#10b981'); 
                    cylinder.setAttribute('material', 'shader: flat; opacity: 0.3; transparent: true; side: double');
                    
                    const text = document.createElement('a-text');
                    text.setAttribute('value', 'DESTINO');
                    text.setAttribute('align', 'center');
                    text.setAttribute('position', '0 2.2 0');
                    text.setAttribute('scale', '1.5 1.5 1.5');
                    text.setAttribute('color', '#10b981');
                    text.setAttribute('look-at', '[camera]');

                    goal.appendChild(cylinder);
                    goal.appendChild(text);
                    routeContainer.appendChild(goal);
                }
            });
        }

        // --- SOLUCIÓN DE ALINEACIÓN EXACTA (BRÚJULA + CÁMARA) ---
        placeBtn.addEventListener('click', () => {
            if (routePlaced) return;

            const position = reticle.getAttribute('position');
            const cameraEl = document.querySelector('[camera]');
            const cameraY = cameraEl.getAttribute('rotation').y;
            
            // Calculamos hacia dónde debe rotar el mapa 3D para alinearse con los 99° reales
            const rotacionFinalY = (cameraY + brujulaActual) - RUTA_HEADING;
            
            routeContainer.setAttribute('position', position);
            routeContainer.setAttribute('rotation', `0 ${rotacionFinalY} 0`);
            
            generarRuta(destino);
            
            routePlaced = true;
            reticle.setAttribute('visible', 'false');
            
            document.getElementById('instructions').style.display = 'none';
            statusText.innerText = "Ruta fijada magnéticamente. Sigue las flechas.";
            statusText.className = "text-white font-bold";
        });

        // Simulación PC
        simularBtn.addEventListener('click', () => {
            entornoSimulado.setAttribute('visible', 'true');
            document.querySelector('[camera]').setAttribute('position', '0 2 2');
            routeContainer.setAttribute('position', '0 0 0');
            generarRuta(destino, true);
            
            document.getElementById('instructions').style.display = 'none';
            statusText.innerText = "Modo Simulación PC";
            statusText.className = "text-blue-400 font-bold";
        });

    </script>
</body>
</html>
